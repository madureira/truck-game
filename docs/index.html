<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Meli Game</title>
  <!-- No favicon: avoids a pointless request (and a 404) when the page loads. -->
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #111;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      color: #ccc;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Phone-shaped stage: fills the screen on a phone, a centered 9:16 column on a desktop. */
    #stage {
      position: relative;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      width: min(100vw, calc(100dvh * 9 / 16));
    }
    /* SDL requires a canvas without border or padding. Its size here is the display size;
       the game picks the drawing-buffer resolution. */
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      outline: none;
      touch-action: none;
    }
    /* Covers the stage while loading and on the start screen. */
    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-size: 15px;
      background: #111;
    }
    /* On the start screen the scene shows through, with the truck parked on the road. */
    #overlay.ready { background: rgba(17, 17, 17, 0.45); }
    #overlay.hidden { display: none; }
    #start {
      display: none;
      min-width: 190px;
      padding: 18px 44px;
      border: 0;
      border-radius: 999px;
      background: #ffe600;
      color: #2d3277;
      font: bold 26px sans-serif;
      letter-spacing: 1px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      touch-action: manipulation;
    }
    #overlay.ready #start { display: block; }
    #overlay.ready #message { display: none; }
    /* HUD: how many boxes were collected. Plain HTML over the canvas: sharp text at any pixel
       density, and it costs the game nothing to draw. It never takes touches from the canvas. */
    #hud {
      display: none;
      position: absolute;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: calc(12px + env(safe-area-inset-left, 0px));
      align-items: center;
      gap: 8px;
      padding: 6px 16px 6px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #2d3277;
      font: bold 22px sans-serif;
      line-height: 1;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      transform-origin: left center;
      pointer-events: none;
    }
    #hud.visible { display: flex; }
    #hud svg { display: block; width: 30px; height: 30px; }
    #hud-count { min-width: 1ch; text-align: right; font-variant-numeric: tabular-nums; }
    /* A little bump each time a box is collected. */
    #hud.pop { animation: hud-pop 0.28s ease-out; }
    @keyframes hud-pop {
      0% { transform: scale(1); }
      35% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }
    /* Frame-rate readout, filled in by the game when the page is opened with ?--fps */
    #fps {
      display: none;
      position: absolute;
      bottom: 6px; left: 6px;
      padding: 3px 7px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font: 12px monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <div id="overlay">
      <span id="message">Carregando&hellip;</span>
      <button id="start" type="button">Start</button>
    </div>
    <div id="hud" aria-label="Caixas coletadas">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <polygon points="16,3 29,9.5 16,16 3,9.5" fill="#dcae7a"/>
        <polygon points="3,9.5 16,16 16,30 3,23.5" fill="#c29160"/>
        <polygon points="29,9.5 16,16 16,30 29,23.5" fill="#a67848"/>
        <polygon points="8,7 11,5.5 24,12 21,13.5" fill="#f0dcae"/>
        <polygon points="21,13.5 24,12 24,19 21,20.5" fill="#d9c08c"/>
      </svg>
      <span id="hud-count">0</span>
    </div>
    <div id="fps"></div>
  </div>

  <script>
    var canvas = document.getElementById('canvas');
    var overlay = document.getElementById('overlay');
    var message = document.getElementById('message');
    var startButton = document.getElementById('start');
    var hud = document.getElementById('hud');
    var hudCount = document.getElementById('hud-count');
    var started = false;

    function showMessage(text) {
      message.textContent = text;
      overlay.className = '';
    }

    // Background music: an <audio> element streams the file, so nothing is decoded up front and
    // it costs no WebAssembly. Browsers only let it play after a user gesture: the Start button.
    var music = new Audio('music.mp3');
    music.loop = true;
    music.preload = 'none';
    music.volume = 0.6;

    function playMusic() {
      var result = music.play();
      if (result && result.catch) { result.catch(function () {}); }
    }

    // Sound effects: tiny files, downloaded while the Start screen is up, decoded once into memory
    // and played through Web Audio, so they start without delay and can overlap. The order of
    // `soundNames` is shared with the game: it must match SoundEffect in SoundPlayer.h.
    var soundNames = ['swipe', 'collect_box', 'collision'];
    // Volumes are gains: 1 plays the file as recorded. swipe.mp3 is recorded very quietly (its
    // peak is 6% of full scale), so it is amplified; at 5 it still peaks at only 30%.
    var soundVolumes = { swipe: 5.0, collect_box: 0.65, collision: 0.9 };
    var soundFiles = {};   // name -> downloaded file, waiting to be decoded
    var soundBuffers = {}; // name -> decoded sound, ready to play
    var soundGains = {};
    var soundsPlayed = {}; // name -> how many times it was played (read by automated checks)
    var audioContext = null;

    function decodeSound(name) {
      if (!audioContext || !soundFiles[name]) { return; }
      var data = soundFiles[name];
      delete soundFiles[name];
      audioContext.decodeAudioData(data, function (buffer) { soundBuffers[name] = buffer; }, function () {});
    }

    soundNames.forEach(function (name) {
      fetch(name + '.mp3')
        .then(function (response) { return response.ok ? response.arrayBuffer() : Promise.reject(); })
        .then(function (data) { soundFiles[name] = data; decodeSound(name); })
        .catch(function () { /* the game simply plays without this sound */ });
    });

    // Browsers only let audio run after a user gesture, so this is called from the Start button
    // and again from any later touch (a phone call or the app going to the background can leave
    // the audio suspended).
    function unlockSounds() {
      var Context = window.AudioContext || window.webkitAudioContext;
      if (!Context) { return; }
      if (!audioContext) {
        audioContext = new Context();
        soundNames.forEach(function (name) {
          soundGains[name] = audioContext.createGain();
          soundGains[name].gain.value = soundVolumes[name];
          soundGains[name].connect(audioContext.destination);
          decodeSound(name);
        });
      }
      if (audioContext.state !== 'running' && !document.hidden) {
        var result = audioContext.resume();
        if (result && result.catch) { result.catch(function () {}); }
      }
    }

    function playSound(index) {
      var name = soundNames[index];
      var buffer = soundBuffers[name];
      if (!buffer || audioContext.state !== 'running') { return; }
      var source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(soundGains[name]);
      source.start();
      soundsPlayed[name] = (soundsPlayed[name] || 0) + 1;
    }

    // Fullscreen is best effort: some browsers and WebViews do not offer it (iPhone Safari, or an
    // app WebView whose host has not enabled it). The game works the same without it.
    function enterFullscreen() {
      var root = document.documentElement;
      var request = root.requestFullscreen || root.webkitRequestFullscreen;
      if (!request) { return; }
      try {
        var result = request.call(root, { navigationUI: 'hide' });
        if (result && result.then) {
          result.then(function () {
            // A portrait game: keep the phone from flipping to landscape where that is allowed.
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('portrait').catch(function () {});
            }
          }).catch(function () {});
        }
      } catch (error) { /* not allowed here: carry on without fullscreen */ }
    }

    // Everything here runs inside the click, which is what allows fullscreen and audio.
    startButton.addEventListener('click', function () {
      if (started) { return; }
      enterFullscreen();
      playMusic();
      unlockSounds();
      Module._meli_game_start();
    });

    document.addEventListener('pointerdown', function () {
      if (started) { unlockSounds(); }
    }, true);

    // Audio follows the page: silent while the app is in the background.
    document.addEventListener('visibilitychange', function () {
      if (!started) { return; }
      if (document.hidden) {
        music.pause();
        if (audioContext) { audioContext.suspend(); }
      } else {
        playMusic();
        unlockSounds();
      }
    });

    // Debug switches come from the query string, e.g. index.html?--autostart&--autopilot
    var query = window.location.search.length > 1
      ? decodeURIComponent(window.location.search.substring(1)).split('&').filter(Boolean)
      : [];

    var Module = {
      canvas: canvas,
      arguments: query.filter(function (item) { return item.indexOf('--') === 0; }),
      // Called by the game once it is loaded and drawing: show the Start button.
      onGameReady: function () {
        overlay.className = 'ready';
        document.body.setAttribute('data-ready', '1');
      },
      // Called by the game when it leaves the start screen.
      onGameStarted: function () {
        started = true;
        overlay.className = 'hidden';
        hud.classList.add('visible');
        // Already done by the Start button; this covers --autostart, where the browser decides
        // whether audio may run without a gesture.
        unlockSounds();
      },
      // Called by the game with the number of boxes collected so far, each time it changes.
      onBoxesCollected: function (count) {
        hudCount.textContent = count;
        if (count > 0) {
          // Restart the bump even if the previous one is still playing.
          hud.classList.remove('pop');
          void hud.offsetWidth;
          hud.classList.add('pop');
        }
      },
      // Called by the game with a SoundEffect value.
      playSound: playSound,
      soundsPlayed: soundsPlayed,
      onAbort: function () { showMessage('Não foi possível iniciar o jogo neste aparelho.'); },
      onExit: function (code) { if (code !== 0) { showMessage('Não foi possível iniciar o jogo neste aparelho.'); } }
    };

    // A WebView sent to the background can lose its WebGL context: offer a clean restart.
    canvas.addEventListener('webglcontextlost', function (event) {
      event.preventDefault();
      showMessage('Toque para recarregar');
      overlay.addEventListener('click', function () { window.location.reload(); });
    });

    // Automated check (index.html?selftest). It presses the Start button and then sends synthetic
    // pointer events to the canvas, recording the lane after each step in <body data-selftest>.
    // Expected: data-selftest="-1,0,1,0,-1,0,0". A gesture counted twice, a second finger that is
    // ignored, a swipe read as a tap or touches that never arrive each give a different trace.
    // <body data-music> tells whether the music is playing (headless Chrome needs
    // --autoplay-policy=no-user-gesture-required for that).
    if (query.indexOf('selftest') !== -1) {
      var fire = function (type, id, kind, x, y) {
        var rect = canvas.getBoundingClientRect();
        canvas.dispatchEvent(new PointerEvent(type, {
          pointerId: id, pointerType: kind, isPrimary: id !== 12,
          clientX: rect.left + rect.width * x, clientY: rect.top + rect.height * (y === undefined ? 0.5 : y),
          button: type === 'pointermove' ? -1 : 0, buttons: type === 'pointerup' ? 0 : 1,
          bubbles: true, cancelable: true
        }));
      };
      var actions = [
        // Mouse click on the left half: 0 -> -1
        function () { fire('pointerdown', 1, 'mouse', 0.25); fire('pointerup', 1, 'mouse', 0.25); },
        // Tap on the right half: -1 -> 0
        function () { fire('pointerdown', 13, 'touch', 0.75); fire('pointerup', 13, 'touch', 0.75); },
        // One finger rests on the left half while a second one taps the right half: 0 -> +1
        function () {
          fire('pointerdown', 11, 'touch', 0.25);
          fire('pointerdown', 12, 'touch', 0.75);
          fire('pointerup', 12, 'touch', 0.75);
        },
        // The resting finger is lifted, which is a tap on the left half: +1 -> 0
        function () { fire('pointerup', 11, 'touch', 0.25); },
        // Swipe to the left that starts on the RIGHT half (the direction wins): 0 -> -1
        function () {
          fire('pointerdown', 14, 'touch', 0.70);
          fire('pointermove', 14, 'touch', 0.60);
          fire('pointermove', 14, 'touch', 0.45);
          fire('pointerup', 14, 'touch', 0.45);
        },
        // Swipe to the right that starts on the LEFT half: -1 -> 0
        function () {
          fire('pointerdown', 15, 'touch', 0.20);
          fire('pointermove', 15, 'touch', 0.50);
          fire('pointerup', 15, 'touch', 0.50);
        },
        // Vertical swipe: no lane change, stays at 0
        function () {
          fire('pointerdown', 16, 'touch', 0.50, 0.30);
          fire('pointermove', 16, 'touch', 0.52, 0.70);
          fire('pointerup', 16, 'touch', 0.52, 0.70);
        }
      ];
      var trace = [];
      var waitForGame = setInterval(function () {
        if (document.body.getAttribute('data-ready') === null) { return; }
        clearInterval(waitForGame);
        startButton.click();
        actions.forEach(function (action, index) {
          setTimeout(action, 500 * index + 300);
          setTimeout(function () {
            trace.push(document.body.getAttribute('data-lane'));
            if (trace.length === actions.length) {
              document.body.setAttribute('data-selftest', trace.join(','));
              document.body.setAttribute('data-started', started ? '1' : '0');
              document.body.setAttribute('data-music', music.paused ? 'paused' : 'playing');
            }
          }, 500 * index + 700);
        });
      }, 100);
    }
  </script>
  <script async type="text/javascript" src="index.js"></script>
</body>
</html>
